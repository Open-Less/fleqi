name: Build Linux and Windows

# 交叉平台构建 CI：Linux 与 Windows 的桌面外壳必须保持可编译、可出安装包，
# 这样 Windows/Linux 附件能力（P1，见 AGENTS.md）落地时不必先修构建。
#
# 注意：附件、Finder 贴合与原生材质是 macOS 专属能力，这两个平台现在的产物只能
# 启动主界面与设置，不能贴合宿主窗口；FFmpeg/qpdf 静态引擎也只在 macOS 构建，
# 因此这里用 FLEQI_SKIP_ENGINES 跳过，产物不用于分发。

on:
  push:
    branches: [beta, main]
  pull_request:
    branches: [beta, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '24'
  FLEQI_SKIP_ENGINES: '1'

jobs:
  linux:
    name: Linux 构建
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - name: 安装依赖与运行时资源
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir runtime/pi install --frozen-lockfile
          node scripts/prepare-runtime.mjs
          bash scripts/prepare-engines.sh
          node scripts/prepare-notices.mjs
      # 编译门禁：失败即拦住，说明共享代码引入了 macOS 专属写法。
      - name: 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
      - name: 打包 deb 与 AppImage
        run: pnpm exec tauri build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: fleqi-linux-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: error

  windows:
    name: Windows 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装依赖与运行时资源
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --dir runtime/pi install --frozen-lockfile
          node scripts/prepare-runtime.mjs
          bash scripts/prepare-engines.sh
          node scripts/prepare-notices.mjs
      - name: 编译检查
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --target x86_64-pc-windows-msvc
      - name: 打包 NSIS 安装包
        run: pnpm exec tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: fleqi-windows-${{ github.sha }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: error
