[package]
name = "fleqi"
version = "0.0.1"
description = "Fleqi desktop control bar"
edition = "2024"
rust-version = "1.85"

[lib]
name = "fleqi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.7", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "rt-multi-thread", "macros"] }
fleqi-core = { path = "../crates/fleqi-core" }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }

[profile.release]
lto = "thin"
# 不要在 macOS 上启用 strip：会破坏 proc-macro dylib 的 LINKEDIT/签名，dyld 报 mis-aligned LINKEDIT string pool

